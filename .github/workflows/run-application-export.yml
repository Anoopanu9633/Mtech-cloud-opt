name: Run Application and Push CSV Exports to Azure Blob

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-and-upload:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from GitHub secrets
        run: |
          cat > .env <<EOF
          AZURE_TENANT_ID=${AZURE_TENANT_ID}
          AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
          AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
          AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID}
          EOF

      - name: Run Azure collector
        run: python run_collector.py

      - name: Export CSV outputs
        run: python export_data.py

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload exports to Azure Blob Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            az storage blob upload-batch \
              --destination "$AZURE_STORAGE_CONTAINER_NAME" \
              --source exports \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --auth-mode login \
              --overwrite true

      # NOTE: The Azure service principal in AZURE_CREDENTIALS must have a Blob Storage role such as
      # "Storage Blob Data Contributor" on the target storage account or resource group.

      - name: Upload export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-export-outputs
          path: exports/**
