name: CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Static syntax check
        run: python -m py_compile backend/main.py database/db.py database/models.py collector/azure_client.py collector/data_fetcher.py optimizer/engine.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cloud-cost-optimizer .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Deployment placeholder
        run: |
          echo "Deployment pipeline executed"
          echo "Add Azure Container Registry or AKS deployment steps here."
